<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5dfc"/>
      <stop offset="1" stop-color="#1fb6a6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824px body with 100px margin -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <g fill="none" stroke="#fff" stroke-width="44" stroke-linecap="round">
    <!-- main line -->
    <path d="M390 300 V724"/>
    <!-- feature branch: leaves main, runs alongside, merges back -->
    <path d="M390 380 C390 470 634 440 634 530 V560 C634 650 390 620 390 700" stroke-opacity="0.85"/>
  </g>
  <g fill="#fff">
    <circle cx="390" cy="300" r="46"/>
    <circle cx="634" cy="545" r="46"/>
    <circle cx="390" cy="724" r="46"/>
  </g>
  <circle cx="390" cy="300" r="22" fill="#6d5dfc"/>
</svg>
