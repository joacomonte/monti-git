[package]
name = "monti-git"
version = "1.6.0"
description = "A git graph for every repo you work on"
authors = ["Joaquín Monte"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix keeps the lib name apart from the bin name (a Windows issue: rust-lang/cargo#8519).
# Desktop only: no staticlib/cdylib for mobile.
name = "monti_git_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1" # used by tauri::generate_context!
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
lto = true # with one codegen unit: a smaller, a bit faster binary, for a slower release build
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
