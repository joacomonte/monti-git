# Push a tag like v0.2.0 (same version as src-tauri/tauri.conf.json) to build Mac + Windows and publish a
# GitHub Release with the signed updater files and latest.json, which installed apps check at launch.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1 # parallel jobs race to rewrite latest.json and one of them fails
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin # one .dmg for Apple Silicon and Intel
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: monti-git ${{ github.ref_name }}
          releaseBody: "Mac: the .dmg (Apple Silicon and Intel). Windows: the -setup.exe. Installed apps update themselves at launch."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
